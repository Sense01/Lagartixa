<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Crawler</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:#0f1115; color:#e8e8e8; display:grid; grid-template-columns:340px 1fr; height:100vh; }
  aside { padding:16px; border-right:1px solid #262a33; overflow:auto; }
  main { padding:16px; display:flex; flex-direction:column; gap:10px; overflow:auto; }
  label { display:block; margin:12px 0 4px; font-size:13px; color:#9aa3b2; }
  input, textarea { width:100%; padding:8px; border-radius:6px; border:1px solid #333a47; background:#171a21; color:inherit; font:inherit; }
  textarea { height:110px; resize:vertical; }
  .row { display:flex; gap:8px; }
  button { flex:1; margin-top:14px; padding:10px; border:0; border-radius:6px; font-weight:600; cursor:pointer; }
  #start { background:#3b82f6; color:#fff; } #stop { background:#2a2f3a; color:#fff; }
  #screen { width:100%; max-width:1100px; aspect-ratio:1100/700; background:#000; border-radius:8px; border:1px solid #262a33; object-fit:contain; }
  #bar { font-size:13px; color:#9aa3b2; word-break:break-all; }
  .hit { background:#171a21; border:1px solid #262a33; border-radius:8px; padding:10px; margin-bottom:8px; }
  .hit a { color:#7cb3ff; } .hit p { margin:6px 0 0; font-size:13px; color:#c3c9d4; }
  mark { background:#ffeb3b; color:#000; }
  @media (max-width:800px){ body{grid-template-columns:1fr; height:auto;} }
</style>
</head>
<body>
<aside>
  <h2>Web Crawler</h2>
  <label>O que procurar (separado por vírgulas)</label>
  <input id="keywords" placeholder="estágio, logística, supply chain">
  <label>Sites (um por linha)</label>
  <textarea id="sites" placeholder="https://exemplo.com"></textarea>
  <label>Máx. páginas por site</label>
  <input id="maxPages" type="number" value="10" min="1" max="50">
  <label>Pausa entre páginas (ms)</label>
  <input id="delay" type="number" value="1000" min="500">
  <div class="row">
    <button id="start">Iniciar</button>
    <button id="stop">Parar</button>
  </div>
</aside>
<main>
  <img id="screen" alt="Vista ao vivo do crawler">
  <div id="bar">Parado.</div>
  <h3>Resultados</h3>
  <div id="hits"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let ws;
function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'frame') $('screen').src = 'data:image/jpeg;base64,' + m.data;
    else if (m.type === 'status') $('bar').textContent = m.message;
    else if (m.type === 'visit') $('bar').textContent = `(${m.visited}) ${m.title || ''} — ${m.url}`;
    else if (m.type === 'hit') addHit(m);
    else if (m.type === 'error') { $('bar').textContent = m.message; }
    else if (m.type === 'done') {
      $('bar').textContent = 'Concluído. ' + m.summary;
      if (Notification.permission === 'granted') new Notification('Pesquisa concluída', { body: m.summary });
    }
  };
  ws.onclose = () => setTimeout(connect, 1500);
}
function esc(s) { return s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
function addHit(h) {
  const d = document.createElement('div');
  d.className = 'hit';
  d.innerHTML = `<a href="${h.url}" target="_blank" rel="noopener">${esc(h.title || h.url)}</a>` +
    h.matches.slice(0, 3).map((x) => {
      const re = new RegExp('(' + x.keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
      return `<p>…${esc(x.snippet).replace(re, '<mark>$1</mark>')}…</p>`;
    }).join('');
  $('hits').prepend(d);
}
$('start').onclick = () => {
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  $('hits').innerHTML = '';
  ws.send(JSON.stringify({ type: 'start', config: {
    keywords: $('keywords').value.split(','),
    sites: $('sites').value.split('\n').map((s) => s.trim()).filter(Boolean),
    maxPages: $('maxPages').value, delay: $('delay').value,
  }}));
};
$('stop').onclick = () => ws.send(JSON.stringify({ type: 'stop' }));
connect();
</script>
</body>
</html>
